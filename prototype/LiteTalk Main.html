<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻音 LiteTalk · 主界面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234FA4F3' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2'/%3E%3C/svg%3E">
<style>
:root{
  --brand-50:#EFF5FA; --brand-200:#C8E3F5; --brand-500:#4FA4F3;
  --brand-600:#3E96EC; --brand-700:#2E7FD1; --brand-800:#2568AC;
  --ink-900:#17324B; --ink-600:#3D5A76; --ink-400:#7E97AE; --ink-300:#A9BCCF;
  --surface:#FFFFFF; --line:#DCE9F6;
  --green:#3FB57F; --red:#E85B5B; --orange:#F0A54C;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --shadow-1:0 2px 8px rgba(23,50,75,.05);
  --shadow-2:0 8px 24px rgba(23,50,75,.08);
  --shadow-3:0 16px 48px rgba(23,50,75,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"MiSans","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink-900);font-size:14px;background:#0E2438;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  display:flex;flex-direction:column;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--brand-200);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-300)}
::-webkit-scrollbar-track{background:transparent}

/* ============ 标题栏 ============ */
.titlebar{height:38px;flex:none;display:flex;align-items:center;padding:0 6px 0 14px;
  background:var(--surface);border-bottom:1px solid var(--line);
  -webkit-app-region:drag;user-select:none;z-index:30}
.titlebar .tb-logo{width:18px;height:18px;border-radius:5px;background:var(--brand-500);
  display:flex;align-items:center;justify-content:center;margin-right:8px}
.titlebar .tb-logo svg{width:11px;height:11px;color:#fff}
.titlebar .tb-name{font-size:12px;font-weight:600;color:var(--ink-600);letter-spacing:.4px}
.tb-controls{margin-left:auto;display:flex;-webkit-app-region:no-drag}
.tb-controls button{width:42px;height:38px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-400);transition:background .15s,color .15s}
.tb-controls button:hover{background:var(--brand-50);color:var(--ink-900)}
.tb-controls button.tb-close:hover{background:var(--red);color:#fff}
.tb-controls svg{width:15px;height:15px}

/* ============ 主体三栏 ============ */
.app{flex:1;display:flex;min-height:0;background:var(--surface)}

/* ---- 服务器栏 ---- */
.rail{width:72px;flex:none;display:flex;flex-direction:column;align-items:center;
  padding:12px 0;gap:10px;
  background:linear-gradient(180deg,var(--brand-600),var(--brand-800))}
.rail-item{position:relative;width:46px;height:46px;flex:none}
.rail-item .ri-btn{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);color:#fff;transition:border-radius .25s var(--ease),background .25s var(--ease)}
.rail-item .ri-btn svg{width:21px;height:21px}
.rail-item:hover .ri-btn{border-radius:13px;background:rgba(255,255,255,.28)}
.rail-item.on .ri-btn{border-radius:13px;background:#fff;color:var(--brand-600)}
.rail-item::before{content:"";position:absolute;left:-13px;top:50%;transform:translateY(-50%) scaleY(0);
  width:4px;height:22px;border-radius:2px;background:#fff;transition:transform .25s var(--ease)}
.rail-item.on::before{transform:translateY(-50%) scaleY(1)}
.rail-badge{position:absolute;right:-2px;bottom:-2px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--brand-700)}
.rail-item[data-tip]::after{content:attr(data-tip);position:absolute;left:60px;top:50%;
  transform:translateY(-50%) translateX(-4px);padding:6px 11px;border-radius:8px;white-space:nowrap;
  background:var(--ink-900);color:#fff;font-size:12px;font-weight:500;opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:40;box-shadow:var(--shadow-2)}
.rail-item[data-tip]:hover::after{opacity:1;transform:translateY(-50%) translateX(0)}
.rail .spacer{flex:1}
.rail-add{width:46px;height:46px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);
  transition:border-radius .25s var(--ease),background .2s,color .2s}
.rail-add:hover{border-radius:13px;background:rgba(255,255,255,.14);color:#fff}
.rail-add svg{width:20px;height:20px}

/* ---- 频道栏 ---- */
.channels{width:248px;flex:none;display:flex;flex-direction:column;background:var(--surface);
  border-right:1px solid var(--line);min-height:0}
.server-head{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.server-head:hover{background:var(--brand-50)}
.server-head .name{font-size:15px;font-weight:700;letter-spacing:.2px}
.server-head svg{width:16px;height:16px;color:var(--ink-400)}
.chan-scroll{flex:1;overflow-y:auto;padding:10px 10px 12px}
.cat{margin-bottom:14px}
.cat-head{display:flex;align-items:center;gap:3px;padding:4px 6px;font-size:11.5px;font-weight:600;
  color:var(--ink-400);letter-spacing:.6px;cursor:pointer;user-select:none;border-radius:7px;transition:color .15s}
.cat-head:hover{color:var(--ink-900)}
.cat-head svg{width:13px;height:13px;transition:transform .25s var(--ease)}
.cat.closed .cat-head svg{transform:rotate(-90deg)}
.cat.closed .cat-items{display:none}
.chan{display:flex;align-items:center;gap:8px;height:34px;padding:0 9px;margin:1px 0;
  border-radius:8px;color:var(--ink-600);cursor:pointer;transition:background .15s,color .15s}
.chan svg{width:16px;height:16px;flex:none;color:var(--ink-400);transition:color .15s}
.chan .cname{flex:1;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .count{font-size:11.5px;color:var(--ink-400);display:flex;align-items:center;gap:3px}
.chan .count svg{width:12px;height:12px}
.chan:hover{background:var(--brand-50);color:var(--ink-900)}
.chan.active{background:rgba(79,164,243,.12);color:var(--brand-700)}
.chan.active svg{color:var(--brand-600)}
.chan.in-voice .cname{font-weight:600}

/* 用户面板 */
.me{margin:0 10px 10px;padding:10px;border-radius:12px;background:var(--brand-50);
  display:flex;align-items:center;gap:10px}
.me-dot{position:relative;width:9px;height:9px;flex:none;margin-left:2px}
.me-dot::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green)}
.me-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;
  border:1.5px solid var(--green);opacity:.4;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.45}50%{transform:scale(1.15);opacity:.1}}
.me-info{flex:1;min-width:0}
.me-info .n{font-size:13.5px;font-weight:600;white-space:nowrap}
.me-info .t{font-size:11px;color:var(--ink-400)}
.me-acts{display:flex;gap:2px}
.icon-btn{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:8px;color:var(--ink-600);transition:background .15s,color .15s,transform .1s var(--ease)}
.icon-btn:hover{background:rgba(79,164,243,.12);color:var(--brand-700)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.danger{background:rgba(232,91,91,.12);color:var(--red)}
.icon-btn.danger:hover{background:rgba(232,91,91,.2)}

/* ---- 舞台 ---- */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--brand-50);position:relative}
.stage-head{height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;background:var(--brand-50);border-radius:10px;padding:3px;gap:2px}
.tabs button{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:8px;
  font-size:13px;font-weight:600;color:var(--ink-400);transition:all .2s var(--ease)}
.tabs button svg{width:15px;height:15px}
.tabs button.on{background:var(--surface);color:var(--brand-700);box-shadow:var(--shadow-1)}
.stage-stats{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:12.5px;color:var(--ink-400)}
.stat{display:flex;align-items:center;gap:6px}
.stat svg{width:14px;height:14px}
.stat .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.stat b{color:var(--ink-600);font-weight:600}
.stage-stats .vr{width:1px;height:18px;background:var(--line)}
#btn-friends.on{background:rgba(79,164,243,.12);color:var(--brand-700)}

.stage-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.view{position:absolute;inset:0;display:none;flex-direction:column;opacity:0;transform:translateY(8px);
  transition:opacity .3s var(--ease),transform .3s var(--ease)}
.view.active{display:flex;opacity:1;transform:none}

/* 语音网格 */
.voice-grid{flex:1;overflow-y:auto;padding:22px;display:grid;gap:16px;align-content:start;
  grid-template-columns:repeat(2,minmax(0,1fr))}
.vcard{position:relative;min-height:172px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:20px;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease);
  animation:cardIn .35s var(--ease) backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.vcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--brand-200)}
.vcard .more{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-300);opacity:0;
  transition:opacity .2s,background .15s,color .15s}
.vcard:hover .more{opacity:1}
.vcard .more:hover{background:var(--brand-50);color:var(--ink-600)}
.vcard .more svg{width:16px;height:16px}
.orb{--idc:var(--brand-500);width:76px;height:76px;border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--idc) 10%,#fff);transition:box-shadow .3s var(--ease)}
.orb-bars{display:flex;align-items:center;gap:3.5px;height:26px}
.orb-bars i{width:4px;height:8px;border-radius:2px;background:var(--idc)}
.vcard.speaking .orb{box-shadow:0 0 0 2px var(--idc),0 0 26px rgba(79,164,243,.25)}
.vcard.speaking .orb-bars i{animation:wave 1.05s ease-in-out infinite;animation-delay:calc(var(--i)*.13s)}
@keyframes wave{0%,100%{height:8px}50%{height:24px}}
.orb>svg{width:26px;height:26px;color:var(--ink-300)}
.orb.state-icon>svg{color:var(--ink-400)}
.vname{font-size:15px;font-weight:600}
.vname .me-tag{font-size:11px;font-weight:600;color:var(--brand-600);background:rgba(79,164,243,.12);
  padding:1px 6px;border-radius:6px;margin-left:5px;vertical-align:1px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:500}
.chip svg{width:12px;height:12px}
.chip.red{background:rgba(232,91,91,.1);color:var(--red)}
.chip.gray{background:var(--brand-50);color:var(--ink-400)}
.chip.brand{background:rgba(79,164,243,.1);color:var(--brand-600)}
/* 邀请卡 */
.vcard.invite{border:1.5px dashed var(--brand-200);background:transparent;cursor:pointer;color:var(--ink-400)}
.vcard.invite:hover{border-color:var(--brand-500);color:var(--brand-600);box-shadow:none;background:rgba(79,164,243,.03)}
.vcard.invite .i-circle{width:44px;height:44px;border-radius:50%;background:rgba(79,164,243,.1);
  display:flex;align-items:center;justify-content:center;color:var(--brand-500);transition:transform .25s var(--ease)}
.vcard.invite:hover .i-circle{transform:scale(1.08)}
.vcard.invite .i-circle svg{width:20px;height:20px}
.vcard.invite span{font-size:13px;font-weight:500}

/* 文字聊天 */
.chat-head{flex:none;padding:14px 22px 0;display:flex;align-items:center;gap:8px;color:var(--ink-600)}
.chat-head svg{width:17px;height:17px;color:var(--ink-400)}
.chat-head b{font-size:15px;color:var(--ink-900)}
.chat-list{flex:1;overflow-y:auto;padding:14px 22px;display:flex;flex-direction:column;gap:14px}
.msg .m-head{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.msg .m-name{font-size:13.5px;font-weight:600}
.msg .m-time{font-size:11px;color:var(--ink-300)}
.msg .m-text{font-size:14px;color:var(--ink-600);line-height:1.65;text-wrap:pretty}
.composer{flex:none;padding:12px 22px 18px;display:flex;gap:10px}
.composer .c-input{flex:1;display:flex;align-items:center;background:var(--surface);
  border:1.5px solid var(--brand-200);border-radius:12px;transition:border-color .2s,box-shadow .2s}
.composer .c-input:focus-within{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(79,164,243,.15)}
.composer input{flex:1;height:42px;padding:0 14px;border:none;outline:none;font-size:14px;
  background:transparent;color:var(--ink-900)}
.composer input::placeholder{color:var(--ink-300)}
.send-btn{width:42px;height:42px;flex:none;border-radius:12px;background:var(--brand-500);color:#fff;
  display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s var(--ease);
  box-shadow:0 4px 12px rgba(79,164,243,.3)}
.send-btn:hover{background:var(--brand-600)}
.send-btn:active{transform:scale(.93)}
.send-btn svg{width:17px;height:17px}

/* 浮动房间卡 */
.room-card{position:absolute;right:22px;bottom:20px;z-index:20;width:250px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-2);
  padding:13px 14px;display:flex;flex-direction:column;gap:11px;
  animation:cardIn .35s var(--ease)}
.room-card.hidden{display:none}
.rc-top{display:flex;align-items:center;gap:8px}
.rc-top svg{width:16px;height:16px;color:var(--brand-500)}
.rc-top .rc-name{font-size:13.5px;font-weight:600;flex:1}
.rc-live{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--green)}
.rc-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);
  animation:pulse 2.4s var(--ease) infinite}
.rc-bottom{display:flex;align-items:center;gap:8px}
.rc-dots{display:flex}
.rc-dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-left:-7px;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.rc-dots i:first-child{margin-left:0}
.rc-meta{flex:1;font-size:11.5px;color:var(--ink-400)}
.rc-leave{width:32px;height:32px;border-radius:9px;background:rgba(232,91,91,.1);color:var(--red);
  display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s var(--ease)}
.rc-leave:hover{background:rgba(232,91,91,.2)}
.rc-leave:active{transform:scale(.9)}
.rc-leave svg{width:15px;height:15px}

/* ---- 好友栏 ---- */
.friends{width:272px;flex:none;background:var(--surface);border-left:1px solid var(--line);
  transition:width .3s var(--ease);overflow:hidden}
.friends.closed{width:0;border-left-color:transparent}
.friends-inner{width:272px;height:100%;display:flex;flex-direction:column}
.f-head{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:1px solid var(--line)}
.f-head b{font-size:15px}
.f-search{flex:none;margin:12px 14px 6px;display:flex;align-items:center;gap:8px;height:36px;
  padding:0 12px;background:var(--brand-50);border-radius:10px;border:1.5px solid transparent;
  transition:border-color .2s,background .2s}
.f-search:focus-within{border-color:var(--brand-500);background:var(--surface)}
.f-search svg{width:15px;height:15px;color:var(--ink-300);flex:none}
.f-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px;color:var(--ink-900)}
.f-search input::placeholder{color:var(--ink-300)}
.f-scroll{flex:1;overflow-y:auto;padding:6px 10px 96px}
.f-group{padding:8px 8px 4px;display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  color:var(--ink-400);letter-spacing:.6px;cursor:pointer;user-select:none}
.f-group svg{width:12px;height:12px;transition:transform .25s var(--ease)}
.f-group.closed svg{transform:rotate(-90deg)}
.f-group.closed~.f-row{display:none}
.f-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;
  transition:background .15s}
.f-row:hover{background:var(--brand-50)}
.f-dot{width:8px;height:8px;flex:none;border-radius:50%}
.f-dot.online{background:var(--green)}
.f-dot.idle{background:var(--orange)}
.f-dot.busy{background:var(--red)}
.f-dot.offline{background:var(--ink-300)}
.f-info{flex:1;min-width:0}
.f-info .fn{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-info .fs{font-size:11.5px;color:var(--ink-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-info .fs.in-chan{color:var(--brand-600);font-weight:500}
.f-row.offline .fn,.f-row.offline .fs{color:var(--ink-300)}
.f-row .f-act{display:none;gap:2px}
.f-row:hover .f-act{display:flex}
.f-row:hover .f-info .fs{display:none}
.f-act .icon-btn{width:28px;height:28px}
.f-act .icon-btn svg{width:14px;height:14px}

/* ---- Toast ---- */
.toast{position:fixed;top:52px;left:50%;transform:translate(-50%,-14px);z-index:60;
  display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:11px;
  background:var(--ink-900);color:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow-2);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:15px;height:15px;color:var(--green)}

/* ---- Tweaks ---- */
.tweaks{position:fixed;right:20px;bottom:20px;z-index:50}
.tw-toggle{width:42px;height:42px;border-radius:13px;background:var(--ink-900);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-2);
  transition:transform .2s var(--ease),background .2s}
.tw-toggle:hover{transform:translateY(-2px);background:var(--ink-600)}
.tw-toggle svg{width:18px;height:18px}
.tw-panel{position:absolute;right:0;bottom:54px;width:224px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-3);padding:14px;
  opacity:0;transform:translateY(8px) scale(.97);transform-origin:bottom right;pointer-events:none;
  transition:opacity .25s var(--ease),transform .25s var(--ease)}
.tweaks.open .tw-panel{opacity:1;transform:none;pointer-events:auto}
.tw-panel h4{font-size:11.5px;font-weight:700;color:var(--ink-300);letter-spacing:1.5px;margin-bottom:12px}
.tw-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tw-row:last-child{margin-bottom:0}
.tw-row span{font-size:13px;font-weight:500;color:var(--ink-600)}
.switch{position:relative;width:36px;height:20px;flex:none}
.switch input{display:none}
.switch i{position:absolute;inset:0;border-radius:10px;background:var(--brand-200);transition:background .2s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-1);transition:transform .25s var(--ease)}
.switch input:checked+i{background:var(--brand-500)}
.switch input:checked+i::after{transform:translateX(16px)}
.tw-seg{display:flex;background:var(--brand-50);border-radius:8px;padding:2px;gap:2px}
.tw-seg button{height:24px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink-400);
  transition:all .2s}
.tw-seg button.on{background:var(--surface);color:var(--brand-700);box-shadow:var(--shadow-1)}

/* ---- 密度 ---- */
body.compact .voice-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
body.compact .vcard{min-height:136px;padding:14px}
body.compact .orb{width:58px;height:58px}
body.compact .orb-bars{height:20px}
body.compact .vname{font-size:14px}

/* ---- 动效开关 ---- */
body.no-anim *,body.no-anim *::before,body.no-anim *::after{
  animation-play-state:paused!important;transition:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<!-- 标题栏 -->
<header class="titlebar">
  <span class="tb-logo"><i data-lucide="audio-waveform"></i></span>
  <span class="tb-name">轻音 LiteTalk</span>
  <div class="tb-controls">
    <button title="最小化"><i data-lucide="minus"></i></button>
    <button title="最大化"><i data-lucide="square"></i></button>
    <button class="tb-close" title="关闭到托盘"><i data-lucide="x"></i></button>
  </div>
</header>

<div class="app">

  <!-- 服务器栏 -->
  <nav class="rail" id="rail">
    <div class="rail-item on" data-tip="语音总部"><button class="ri-btn"><i data-lucide="messages-square"></i></button></div>
    <div class="rail-item" data-tip="竞技开黑"><button class="ri-btn"><i data-lucide="gamepad-2"></i></button><span class="rail-badge">3</span></div>
    <div class="rail-item" data-tip="音乐电台"><button class="ri-btn"><i data-lucide="music"></i></button></div>
    <div class="rail-item" data-tip="设计工坊"><button class="ri-btn"><i data-lucide="palette"></i></button></div>
    <div class="rail-item" data-tip="读书会"><button class="ri-btn"><i data-lucide="book-open"></i></button></div>
    <div class="spacer"></div>
    <button class="rail-add" title="创建或加入服务器"><i data-lucide="plus"></i></button>
  </nav>

  <!-- 频道栏 -->
  <aside class="channels">
    <div class="server-head"><span class="name" id="server-name">语音总部</span><i data-lucide="chevron-down"></i></div>
    <div class="chan-scroll">
      <div class="cat">
        <div class="cat-head"><i data-lucide="chevron-down"></i>文字频道</div>
        <div class="cat-items">
          <div class="chan text-chan" data-name="通知公告"><i data-lucide="pin"></i><span class="cname">通知公告</span></div>
          <div class="chan text-chan active" data-name="闲聊广场"><i data-lucide="hash"></i><span class="cname">闲聊广场</span></div>
          <div class="chan text-chan" data-name="技术讨论"><i data-lucide="hash"></i><span class="cname">技术讨论</span></div>
        </div>
      </div>
      <div class="cat">
        <div class="cat-head"><i data-lucide="chevron-down"></i>语音频道</div>
        <div class="cat-items" id="voice-chan-list">
          <div class="chan voice-chan in-voice active" data-ch="ch-hall"><i data-lucide="volume-2"></i><span class="cname">休闲大厅</span><span class="count"><i data-lucide="user-round"></i>4</span></div>
          <div class="chan voice-chan" data-ch="ch-game1"><i data-lucide="volume-2"></i><span class="cname">竞技室 #1</span><span class="count"><i data-lucide="user-round"></i>2</span></div>
          <div class="chan voice-chan" data-ch="ch-game2"><i data-lucide="volume-2"></i><span class="cname">竞技室 #2</span></div>
          <div class="chan voice-chan" data-ch="ch-private"><i data-lucide="lock"></i><span class="cname">私密会议室</span><span class="count"><i data-lucide="user-round"></i>1</span></div>
        </div>
      </div>
      <div class="cat">
        <div class="cat-head"><i data-lucide="chevron-down"></i>特殊频道</div>
        <div class="cat-items">
          <div class="chan"><i data-lucide="eye"></i><span class="cname">观众席</span><span class="count"><i data-lucide="user-round"></i>8</span></div>
        </div>
      </div>
    </div>

    <!-- 用户面板 -->
    <div class="me">
      <span class="me-dot"></span>
      <div class="me-info"><div class="n">Alex</div><div class="t">#6847 · 在线</div></div>
      <div class="me-acts">
        <button class="icon-btn" id="btn-mic" title="静音"><i data-lucide="mic"></i></button>
        <button class="icon-btn" id="btn-deafen" title="耳聋"><i data-lucide="headphones"></i></button>
        <button class="icon-btn" title="设置"><i data-lucide="settings"></i></button>
      </div>
    </div>
  </aside>

  <!-- 舞台 -->
  <main class="stage">
    <div class="stage-head">
      <div class="tabs">
        <button class="on" id="tab-voice"><i data-lucide="audio-lines"></i>语音房间</button>
        <button id="tab-chat"><i data-lucide="message-circle"></i>文字聊天</button>
      </div>
      <div class="stage-stats">
        <span class="stat"><span class="dot"></span>延迟 <b id="latency">24ms</b></span>
        <span class="stat"><i data-lucide="users"></i><b id="room-count">4</b> 人在频道</span>
        <span class="vr"></span>
        <button class="icon-btn on" id="btn-friends" title="好友列表"><i data-lucide="users"></i></button>
      </div>
    </div>

    <div class="stage-body">
      <!-- 语音视图 -->
      <section class="view active" id="view-voice">
        <div class="voice-grid" id="voice-grid"></div>
      </section>

      <!-- 聊天视图 -->
      <section class="view" id="view-chat">
        <div class="chat-head"><i data-lucide="hash"></i><b id="chat-chan-name">闲聊广场</b></div>
        <div class="chat-list" id="chat-list">
          <div class="msg"><div class="m-head"><span class="m-name">Yuki</span><span class="m-time">12:02</span></div><p class="m-text">晚上开黑吗</p></div>
          <div class="msg"><div class="m-head"><span class="m-name">Milo</span><span class="m-time">12:05</span></div><p class="m-text">我先去吃饭，七点回来</p></div>
          <div class="msg"><div class="m-head"><span class="m-name">Sora</span><span class="m-time">12:06</span></div><p class="m-text">行，到时候叫我</p></div>
        </div>
        <div class="composer">
          <div class="c-input"><input id="chat-input" placeholder="发送到 #闲聊广场" maxlength="2000"></div>
          <button class="send-btn" id="btn-send" title="发送"><i data-lucide="send"></i></button>
        </div>
      </section>

      <!-- 浮动房间卡 -->
      <div class="room-card" id="room-card">
        <div class="rc-top">
          <i data-lucide="audio-lines"></i>
          <span class="rc-name" id="rc-name">休闲大厅</span>
          <span class="rc-live">已连接</span>
        </div>
        <div class="rc-bottom">
          <div class="rc-dots" id="rc-dots"></div>
          <span class="rc-meta"><span id="rc-count">4</span> 人在线 · <span id="rc-timer">12:34</span></span>
          <button class="rc-leave" id="btn-leave" title="离开频道"><i data-lucide="phone-off"></i></button>
        </div>
      </div>
    </div>
  </main>

  <!-- 好友栏 -->
  <aside class="friends" id="friends">
    <div class="friends-inner">
      <div class="f-head"><b>好友列表</b><button class="icon-btn" title="添加好友"><i data-lucide="user-plus"></i></button></div>
      <div class="f-search"><i data-lucide="search"></i><input id="f-search-input" placeholder="搜索好友..."></div>
      <div class="f-scroll" id="f-scroll"></div>
    </div>
  </aside>
</div>

<!-- Toast -->
<div class="toast" id="toast"><i data-lucide="circle-check"></i><span id="toast-text"></span></div>

<!-- Tweaks -->
<div class="tweaks" id="tweaks">
  <div class="tw-panel">
    <h4>TWEAKS</h4>
    <div class="tw-row"><span>界面动效</span>
      <label class="switch"><input type="checkbox" id="tw-anim" checked><i></i></label>
    </div>
    <div class="tw-row"><span>卡片密度</span>
      <div class="tw-seg">
        <button class="on" data-density="">舒适</button>
        <button data-density="compact">紧凑</button>
      </div>
    </div>
  </div>
  <button class="tw-toggle" id="tw-toggle" title="Tweaks" style="margin-left:auto;display:flex"><i data-lucide="sliders-horizontal"></i></button>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
(function(){
  if (window.lucide) lucide.createIcons();
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  function refreshIcons(){ if (window.lucide) lucide.createIcons(); }

  /* ============ 数据 ============ */
  var ID_COLORS = ['#4FA4F3','#3DBBC4','#7C8CF8','#3FB57F'];
  var ME = { name:'Alex', color:2, me:true };
  var voiceChannels = {
    'ch-hall':   { name:'休闲大厅',  members:[
      {name:'Yuki', color:0, speaking:true},
      {name:'Milo', color:1, muted:true},
      {name:'Sora', color:2, state:'等待中'},
      {name:'Lena', color:3, deafen:true} ]},
    'ch-game1':  { name:'竞技室 #1', members:[ {name:'Zeph',color:1}, {name:'Kira',color:3} ]},
    'ch-game2':  { name:'竞技室 #2', members:[] },
    'ch-private':{ name:'私密会议室', locked:true, members:[ {name:'Riva',color:0} ]}
  };
  var friends = [
    {name:'Yuki', st:'online',  sub:'休闲大厅', chan:true},
    {name:'Milo', st:'online',  sub:'休闲大厅', chan:true},
    {name:'Nael', st:'idle',    sub:'离开'},
    {name:'Sora', st:'online',  sub:'在线'},
    {name:'Lena', st:'busy',    sub:'忙碌'},
    {name:'Riva', st:'online',  sub:'在线'},
    {name:'Zeph', st:'online',  sub:'竞技室 #1', chan:true},
    {name:'Dax',  st:'online',  sub:'在线'}
  ];
  var friendsOffline = [ {name:'Quinn'}, {name:'Tara'} ];

  var state = { joined:'ch-hall', view:'ch-hall', muted:false, deafened:false, speaking:false };

  /* ============ 语音网格渲染 ============ */
  var grid = $('#voice-grid');
  function orbHTML(m){
    var color = ID_COLORS[m.color % 4];
    if (m.muted)   return '<div class="orb state-icon" style="--idc:'+color+'"><i data-lucide="mic-off"></i></div>';
    if (m.deafen)  return '<div class="orb state-icon" style="--idc:'+color+'"><i data-lucide="headphone-off"></i></div>';
    var bars = '';
    for (var i=0;i<5;i++) bars += '<i style="--i:'+i+'"></i>';
    return '<div class="orb" style="--idc:'+color+'"><div class="orb-bars">'+bars+'</div></div>';
  }
  function chipHTML(m){
    if (m.muted)  return '<span class="chip red"><i data-lucide="mic-off"></i>已静音</span>';
    if (m.deafen) return '<span class="chip red"><i data-lucide="headphone-off"></i>已耳聋</span>';
    if (m.speaking) return '<span class="chip brand"><i data-lucide="audio-lines"></i>正在说话</span>';
    if (m.state)  return '<span class="chip gray">'+m.state+'</span>';
    return '';
  }
  function cardHTML(m, idx){
    var cls = 'vcard' + (m.speaking && !m.muted && !m.deafen ? ' speaking' : '');
    return '<div class="'+cls+'" style="animation-delay:'+(idx*45)+'ms">'
      + '<button class="more" title="更多"><i data-lucide="more-horizontal"></i></button>'
      + orbHTML(m)
      + '<div class="vname">'+m.name+(m.me?'<span class="me-tag">我</span>':'')+'</div>'
      + chipHTML(m)
      + '</div>';
  }
  function renderGrid(){
    var ch = voiceChannels[state.view];
    var members = ch.members.slice();
    if (state.joined === state.view) members.unshift(currentMe());
    var html = members.map(cardHTML).join('');
    html += '<div class="vcard invite" id="vcard-invite"><div class="i-circle"><i data-lucide="user-plus"></i></div><span>邀请朋友加入频道</span></div>';
    grid.innerHTML = html;
    var shown = state.joined === state.view ? members.length : ch.members.length;
    $('#room-count').textContent = shown;
    refreshIcons();
    $('#vcard-invite').addEventListener('click', function(){ toast('邀请链接已复制'); });
  }
  function currentMe(){
    return { name:ME.name, color:ME.color, me:true,
      muted: state.muted, deafen: state.deafened, speaking: state.speaking && !state.muted };
  }

  /* ============ 频道加入/离开 ============ */
  var roomCard = $('#room-card');
  function renderRoomCard(){
    var ch = voiceChannels[state.joined];
    if (!ch){ roomCard.classList.add('hidden'); return; }
    roomCard.classList.remove('hidden');
    $('#rc-name').textContent = ch.name;
    var members = ch.members.slice();
    if (state.joined === state.view || true) members.unshift(currentMe());
    $('#rc-count').textContent = ch.members.length + 1;
    $('#rc-dots').innerHTML = members.slice(0,5).map(function(m){
      return '<i style="background:'+ID_COLORS[m.color%4]+'"></i>';
    }).join('');
  }
  function joinChannel(chId){
    if (state.joined === chId){ state.view = chId; renderGrid(); return; }
    state.joined = chId; state.view = chId;
    $$('.voice-chan').forEach(function(el){
      el.classList.toggle('active', el.dataset.ch === chId);
      el.classList.toggle('in-voice', el.dataset.ch === chId);
    });
    renderGrid(); renderRoomCard();
    toast('已加入 ' + voiceChannels[chId].name);
  }
  $$('.voice-chan').forEach(function(el){
    el.addEventListener('click', function(){ joinChannel(el.dataset.ch); });
  });
  $('#btn-leave').addEventListener('click', function(){
    var name = voiceChannels[state.joined].name;
    state.joined = null;
    $$('.voice-chan').forEach(function(el){ el.classList.remove('in-voice'); });
    renderGrid(); renderRoomCard();
    toast('已离开 ' + name);
  });

  /* ============ 静音 / 耳聋 ============ */
  function setIcon(btn, name){ btn.innerHTML = '<i data-lucide="'+name+'"></i>'; refreshIcons(); }
  $('#btn-mic').addEventListener('click', function(){
    state.muted = !state.muted;
    if (state.muted) state.speaking = false;
    this.classList.toggle('danger', state.muted);
    setIcon(this, state.muted ? 'mic-off' : 'mic');
    this.title = state.muted ? '取消静音' : '静音';
    if (state.joined){ renderGrid(); }
  });
  $('#btn-deafen').addEventListener('click', function(){
    state.deafened = !state.deafened;
    if (state.deafened && !state.muted){ state.muted = true;
      var mb = $('#btn-mic'); mb.classList.add('danger'); setIcon(mb,'mic-off'); }
    this.classList.toggle('danger', state.deafened);
    setIcon(this, state.deafened ? 'headphone-off' : 'headphones');
    this.title = state.deafened ? '取消耳聋' : '耳聋';
    if (state.joined){ renderGrid(); }
  });

  /* ============ 页签 ============ */
  var tabVoice = $('#tab-voice'), tabChat = $('#tab-chat');
  function switchTab(voice){
    tabVoice.classList.toggle('on', voice);
    tabChat.classList.toggle('on', !voice);
    $('#view-voice').classList.toggle('active', voice);
    $('#view-chat').classList.toggle('active', !voice);
  }
  tabVoice.addEventListener('click', function(){ switchTab(true); });
  tabChat.addEventListener('click', function(){ switchTab(false); });

  /* 文字频道 → 切到聊天页 */
  $$('.text-chan').forEach(function(el){
    el.addEventListener('click', function(){
      $$('.text-chan').forEach(function(c){ c.classList.remove('active'); });
      el.classList.add('active');
      $('#chat-chan-name').textContent = el.dataset.name;
      $('#chat-input').placeholder = '发送到 #' + el.dataset.name;
      switchTab(false);
    });
  });

  /* ============ 分类折叠 ============ */
  $$('.cat-head').forEach(function(h){
    h.addEventListener('click', function(){ h.parentElement.classList.toggle('closed'); });
  });

  /* ============ 服务器栏 ============ */
  $$('.rail-item').forEach(function(item){
    item.querySelector('.ri-btn').addEventListener('click', function(){
      $$('.rail-item').forEach(function(i){ i.classList.remove('on'); });
      item.classList.add('on');
      $('#server-name').textContent = item.dataset.tip;
    });
  });

  /* ============ 好友栏 ============ */
  var friendsPanel = $('#friends');
  $('#btn-friends').addEventListener('click', function(){
    friendsPanel.classList.toggle('closed');
    this.classList.toggle('on', !friendsPanel.classList.contains('closed'));
  });
  function friendRow(f, offline){
    var stText = offline ? '离线' : f.sub;
    return '<div class="f-row'+(offline?' offline':'')+'" data-name="'+f.name.toLowerCase()+'">'
      + '<span class="f-dot '+(offline?'offline':f.st)+'"></span>'
      + '<div class="f-info"><div class="fn">'+f.name+'</div>'
      + '<div class="fs'+(f.chan?' in-chan':'')+'">'+stText+'</div></div>'
      + (offline ? '' : '<div class="f-act"><button class="icon-btn" title="私聊"><i data-lucide="message-circle"></i></button>'
        + (f.chan ? '<button class="icon-btn" title="加入TA的频道"><i data-lucide="audio-lines"></i></button>' : '')
        + '</div>')
      + '</div>';
  }
  function renderFriends(){
    var html = '<div class="f-group" id="fg-online"><i data-lucide="chevron-down"></i>在线 — ' + friends.length + '</div>';
    html += friends.map(function(f){ return friendRow(f, false); }).join('');
    html += '<div class="f-group closed" id="fg-offline"><i data-lucide="chevron-down"></i>离线 — ' + friendsOffline.length + '</div>';
    html += friendsOffline.map(function(f){ return friendRow(f, true); }).join('');
    $('#f-scroll').innerHTML = html;
    refreshIcons();
    $$('.f-group').forEach(function(g){
      g.addEventListener('click', function(){ g.classList.toggle('closed'); });
    });
  }
  renderFriends();
  $('#f-search-input').addEventListener('input', function(){
    var q = this.value.trim().toLowerCase();
    $$('.f-row').forEach(function(row){
      row.style.display = row.dataset.name.indexOf(q) >= 0 ? '' : 'none';
    });
  });

  /* ============ 聊天发送 ============ */
  function sendChat(){
    var input = $('#chat-input'), v = input.value.trim();
    if (!v) return;
    var list = $('#chat-list');
    var now = new Date();
    var t = ('0'+now.getHours()).slice(-2) + ':' + ('0'+now.getMinutes()).slice(-2);
    var el = document.createElement('div');
    el.className = 'msg';
    el.innerHTML = '<div class="m-head"><span class="m-name">Alex</span><span class="m-time">'+t+'</span></div><p class="m-text"></p>';
    el.querySelector('.m-text').textContent = v;
    list.appendChild(el);
    list.scrollTop = list.scrollHeight;
    input.value = '';
  }
  $('#btn-send').addEventListener('click', sendChat);
  $('#chat-input').addEventListener('keydown', function(e){ if (e.key === 'Enter') sendChat(); });

  /* ============ Toast ============ */
  var toastEl = $('#toast'), toastTimer = null;
  function toast(msg){
    $('#toast-text').textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
  }

  /* ============ 延迟 & 计时 ============ */
  setInterval(function(){
    $('#latency').textContent = (22 + Math.round(Math.random()*8)) + 'ms';
  }, 3000);
  var callSec = 12*60 + 34;
  setInterval(function(){
    if (!state.joined) return;
    callSec++;
    var m = Math.floor(callSec/60), s = callSec%60;
    $('#rc-timer').textContent = ('0'+m).slice(-2) + ':' + ('0'+s).slice(-2);
  }, 1000);

  /* 说话演示：Yuki 周期性说话 */
  setInterval(function(){
    var yuki = voiceChannels['ch-hall'].members[0];
    yuki.speaking = !yuki.speaking;
    if (state.view === 'ch-hall') renderGrid();
  }, 4200);

  /* ============ Tweaks ============ */
  var tweaks = $('#tweaks');
  $('#tw-toggle').addEventListener('click', function(e){
    e.stopPropagation(); tweaks.classList.toggle('open');
  });
  document.addEventListener('click', function(e){
    if (!tweaks.contains(e.target)) tweaks.classList.remove('open');
  });
  $('#tw-anim').addEventListener('change', function(){
    document.body.classList.toggle('no-anim', !this.checked);
  });
  $$('.tw-seg button').forEach(function(b){
    b.addEventListener('click', function(){
      $$('.tw-seg button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      document.body.classList.toggle('compact', b.dataset.density === 'compact');
    });
  });

  /* ============ 初始化 ============ */
  renderGrid();
  renderRoomCard();
})();
</script>
</body>
</html>
